const CHIPS={"Dashboard":"Build a finished, professionally designed dashboard on a new sheet from the data in my active sheet: KPI cards, 2 to 3 charts that suit the data, and a summary table, all driven by formulas on the source data.",
"Clean data":"Clean the data in my active sheet: trim spaces, fix inconsistent entries and number or date formats, convert it into a formatted Excel table, and freeze the header row. Do not delete rows.",
"Best chart":"Choose the most suitable chart for my selected data and insert it, sized and styled cleanly, with a specific title and readable axes.",
"Add formulas":"Study my data and add the calculated columns an analyst would need (totals, percentages, growth, rankings) with proper formulas and number formats.",
"Format sheet":"Format the active sheet to a professional standard: header style, number formats, column widths, borders, banding and conditional formatting where it adds meaning.",
"Budget tracker":"Create a monthly budget workbook sheet with income, categorized expenses, planned vs actual, variance, remaining balance, category dropdowns and a chart.",
"Project tracker":"Create a project tracker sheet with tasks, owner, status dropdown, start and due dates, overdue highlighting and a progress summary.",
"Insights":"Analyze my data and present the five most important findings on a new sheet named Insights, supported by live formulas and one supporting chart."};
const SYS=`You are the engine behind Model Analysis Hub, an Excel add-in. Turn the request into JavaScript for the Office.js Excel API. Work like a senior data analyst and a professional spreadsheet designer.

RESPONSE FORMAT
- One short neutral sentence stating the action (no first person, no greetings, no emojis), then exactly ONE \`\`\`js block. If the user only asks a question, answer concisely in plain text with no code block.

HOW TO WORK
- Study the workbook context first (headers, column profile, sample rows). Choose metrics, groupings and chart types that fit the actual data. Handle blanks, numbers stored as text and mixed types. Use the real sheet names and ranges from the context. Never invent data unless the user asks for a template; for templates use clean, realistic rows with believable values.
- Excel dates are serial numbers; format them as dates (dd-mmm-yyyy).
- Code is the BODY of an async function with variables: context, Excel, H (helper kit below). Do not call Excel.run. Use await and finish with await context.sync().
- Never delete or overwrite existing user data unless explicitly asked. New content goes on new sheets created with await H.sheet(context,"Name").
- Prefer live formulas over typed numbers. Wrap divisions in IFERROR. SUMIFS, COUNTIFS, AVERAGEIFS, XLOOKUP, UNIQUE, FILTER, SORT are allowed. Array sizes must exactly match the target range.
- Load before reading (load, then await context.sync()). No alert, prompt, fetch, window, document or VBA. Keep under about 180 lines.

DESIGN STANDARDS (the result must look hand-built by an experienced Excel professional)
- The workbook contains only real content. Never write words such as AI, generated, auto, sample, placeholder, example, lorem, TODO, created by, instructions, disclaimers or commentary into any cell, sheet name, chart or comment. No emojis anywhere.
- One restrained palette from H.pal (navy and blue with neutrals; green/red/amber only to signal good/bad/warning). Calibri; titles 18-20 bold, section labels 12 bold, body 10-11.
- Grid layout: column A is a narrow margin (width about 12), content starts at B2, title via H.title, one blank row or column between blocks, consistent widths, elements aligned to cell edges.
- Dashboards and reports: gridlines off, KPI cards via H.card, charts positioned to the grid with setPosition, summary table beside or below. Every chart: specific title, legend only if more than one series, light gridlines, readable labels, palette colors.
- Data sheets: header row styled with H.header, top row frozen, light gray borders, banding or a table style, columns autofit then capped.
- Always set number formats: currency, percentages "0.0%", thousands separators, dates. Numbers right-aligned, text left-aligned, headers centered, consistent decimals.
- Name sheets as a person would ("Sales Dashboard", "Summary", "Budget"). Finish each new sheet with H.finish(sheet,{noGrid:true or false,tab:color}) so it opens clean at A1.
- Use conditional formatting only where it carries meaning (variance, overdue, top/bottom).

HELPER KIT H (already defined, use it)
 H.pal = {navy, blue, sky, gray, line, ink, green, red, amber}
 await H.sheet(context,name) returns a new worksheet with a unique name
 H.title(sheet,"B2","Title","optional subtitle")
 H.header(range,fill?) styled header row
 H.card(sheet,"B4:D7","Label","=formula",fill?,numberFormat?) KPI card: first row is the label, remaining rows the value
 H.table(sheet,"B10:F40","TableName",style?) creates a uniquely named Excel table
 H.box(range) light borders; H.fit(sheet) autofit; H.finish(sheet,{noGrid,tab})

OFFICE.JS REMINDERS
- Charts: const ch=sheet.charts.add(Excel.ChartType.columnClustered,range,Excel.ChartSeriesBy.columns); ch.title.text="..."; ch.setPosition("H4","O20"); ch.legend.visible=false; ch.axes.valueAxis.majorGridlines.format.line.color="#E7E6E6"; ch.series.getItemAt(0).format.fill.setSolidColor(H.pal.blue). Chart data must be one contiguous range, so build a summary table first.
- Conditional formats: range.conditionalFormats.add(Excel.ConditionalFormatType.cellValue); cf.cellValue.format.fill.color="#F8CBAD"; cf.cellValue.rule={formula1:"=0",operator:"LessThan"}. Also colorScale, dataBar, custom.
- Validation: range.dataValidation.rule={list:{inCellDropDown:true,source:"A,B,C"}}
- sheet.freezePanes.freezeRows(1); range.format.columnWidth=80 (points); sheet.showGridlines=false
- Pivot tables only when explicitly asked.`;
const H={pal:{navy:"#1F3864",blue:"#2F5597",sky:"#DDEBF7",gray:"#F2F2F2",line:"#BFBFBF",ink:"#262626",green:"#548235",red:"#C00000",amber:"#BF8F00"},
 async sheet(context,name){const ws=context.workbook.worksheets;ws.load("items/name");await context.sync();const have=ws.items.map(s=>s.name.toLowerCase());let n=name,i=2;while(have.includes(n.toLowerCase())){n=name+" "+i++}const s=ws.add(n);await context.sync();return s},
 header(r,fill){r.format.fill.color=fill||H.pal.navy;r.format.font.color="#FFFFFF";r.format.font.bold=true;r.format.horizontalAlignment="Center";r.format.verticalAlignment="Center";r.format.rowHeight=24},
 title(s,addr,text,sub){const r=s.getRange(addr);r.values=[[text]];r.format.font.size=20;r.format.font.bold=true;r.format.font.color=H.pal.navy;if(sub){const q=r.getOffsetRange(1,0);q.values=[[sub]];q.format.font.size=10;q.format.font.color="#7F7F7F"}},
 card(s,addr,label,formula,fill,fmt){const r=s.getRange(addr),l=r.getRow(0),v=r.getOffsetRange(1,0).getResizedRange(-1,0);l.getCell(0,0).values=[[label]];v.getCell(0,0).formulas=[[formula]];if(fmt)v.getCell(0,0).numberFormat=[[fmt]];l.merge();v.merge();r.format.fill.color=fill||H.pal.sky;l.format.font.size=10;l.format.font.color="#595959";l.format.horizontalAlignment="Center";v.format.font.size=22;v.format.font.bold=true;v.format.font.color=H.pal.navy;v.format.horizontalAlignment="Center";v.format.verticalAlignment="Center";["EdgeTop","EdgeBottom","EdgeLeft","EdgeRight"].forEach(e=>{const b=r.format.borders.getItem(e);b.style="Continuous";b.color="#FFFFFF"})},
 table(s,addr,name,style){const t=s.tables.add(addr,true);t.name=name||("Table"+Math.floor(Math.random()*1e6));t.style=style||"TableStyleMedium2";return t},
 box(r){["EdgeTop","EdgeBottom","EdgeLeft","EdgeRight","InsideHorizontal"].forEach(e=>{const b=r.format.borders.getItem(e);b.style="Continuous";b.color=H.pal.line})},
 fit(s){const u=s.getUsedRange();u.format.autofitColumns();u.format.autofitRows()},
 finish(s,o){o=o||{};if(o.noGrid)s.showGridlines=false;if(o.tab)s.tabColor=o.tab;s.activate();s.getRange("A1").select()}};

function profile(v){if(!v||v.length<2)return "";const h=v[0],rows=v.slice(1);return h.map((n,i)=>{const col=rows.map(r=>r[i]).filter(x=>x!==""&&x!==null);const nums=col.filter(x=>typeof x==="number");const num=col.length&&nums.length>col.length*.8;
 return `${i+1}. ${n} [${num?"number":"text"}, ${col.length} filled`+(num?`, min ${Math.min(...nums)}, max ${Math.max(...nums)}`:`, ${new Set(col).size} distinct`)+"]"}).join("; ")}
async function ctxInfo(){try{return await Excel.run(async c=>{const wb=c.workbook,ws=wb.worksheets;ws.load("items/name");const a=ws.getActiveWorksheet();a.load("name");const s=wb.getSelectedRange();s.load("address,values,rowCount,columnCount");await c.sync();
 const items=ws.items.slice(0,6).map(x=>{const u=x.getUsedRangeOrNullObject(true);u.load("address,values,rowCount,columnCount");return [x.name,u]});await c.sync();
 let o=`Active sheet: ${a.name}\nSelection: ${s.address}${s.rowCount*s.columnCount<=40?" values "+JSON.stringify(s.values):""}\nAll sheets: ${ws.items.map(x=>x.name).join(", ")}\n`;
 for(const [n,u] of items){if(u.isNullObject){o+=`--- "${n}": empty\n`;continue}const act=n===a.name;o+=`--- Sheet "${n}" range ${u.address} (${u.rowCount} rows x ${u.columnCount} cols)\nColumns: ${profile(u.values)}\nRows: ${JSON.stringify(u.values.slice(0,act?15:4))}\n`}
 return o})}catch(e){return "(no context)"}}
async function llm1(msgs,c,sys){c=c||cur();sys=sys||SYS;if(!c.key)throw Error("Enter your API key in Settings.");
 if(c.p==="gemini"){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${c.model}:generateContent?key=${c.key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:msgs.map(x=>({role:x.role==="assistant"?"model":"user",parts:[{text:x.content}]})),generationConfig:{temperature:.2}})});
  const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);return j.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join("")||""}
 if(c.p==="anthropic"){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:c.model,max_tokens:8000,temperature:.2,system:sys,messages:msgs})});
  const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);return (j.content||[]).map(x=>x.text||"").join("")}
 const url=c.p==="groq"?"https://api.groq.com/openai/v1/chat/completions":"https://api.openai.com/v1/chat/completions";
 const body={model:c.model,messages:[{role:"system",content:sys},...msgs]};if(c.p==="groq")body.temperature=.2;
 const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+c.key},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);return j.choices[0].message.content}
async function autoModel(){const k=(ST.keys.gemini||"").trim();const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${k}`);const j=await r.json();
 const c=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/flash/.test(m.name)&&!/lite|image|tts|live|audio|exp|8b|vision/.test(m.name)).map(m=>m.name.replace("models/",""));
 const v=s=>parseFloat((s.match(/(\d+(?:\.\d+)?)/)||[0,0])[1]);c.sort((a,b)=>v(b)-v(a));if(!c.length)throw Error("No compatible model found for this key.");ST.models.gemini=c[0];persist();return c[0]}
async function llm(msgs){let sw=false;for(let i=0;i<4;i++){try{return await llm1(msgs)}catch(e){
 if(!sw&&ST.prov==="gemini"&&/no longer available|not found|not supported|deprecated/i.test(e.message)){sw=true;const m=await autoModel();add("Model updated to "+m+".");continue}
 if(/quota|rate|429|exhaust|overload|unavailable|busy/i.test(e.message)&&i<3){add("Rate limit reached. Retrying in 10 seconds.");await new Promise(r=>setTimeout(r,10000))}else throw e}}}
async function run(code){const AF=Object.getPrototypeOf(async function(){}).constructor;
 await Excel.run(async context=>{await new AF("context","Excel","H",code)(context,Excel,H);await context.sync()})}
async function snapshot(){return await Excel.run(async c=>{const ws=c.workbook.worksheets;ws.load("items/name");await c.sync();
 const r=ws.items.map(s=>{const u=s.getUsedRangeOrNullObject(true);u.load("address,formulas,rowCount,columnCount");s.charts.load("items/name");s.tables.load("items/name");return [s,u]});await c.sync();
 const o={names:ws.items.map(s=>s.name),sheets:{}};
 for(const [s,u] of r){const big=!u.isNullObject&&u.rowCount*u.columnCount>60000;o.sheets[s.name]={charts:s.charts.items.map(x=>x.name),tables:s.tables.items.map(x=>x.name),addr:u.isNullObject?null:u.address.split("!").pop().replace(/'/g,""),f:(u.isNullObject||big)?null:u.formulas}}
 return o})}
async function undo(silent){if(!snap){if(!silent)add("Nothing to undo yet.");return}
 try{await Excel.run(async c=>{const ws=c.workbook.worksheets;ws.load("items/name");await c.sync();
  ws.items.forEach(s=>{if(!snap.names.includes(s.name))s.delete()});await c.sync();
  for(const n in snap.sheets){try{const s=ws.getItem(n),d=snap.sheets[n];s.charts.load("items/name");s.tables.load("items/name");await c.sync();
   s.charts.items.forEach(x=>{if(!d.charts.includes(x.name))x.delete()});s.tables.items.forEach(x=>{if(!d.tables.includes(x.name))x.delete()});await c.sync();
   if(d.f){const u=s.getUsedRangeOrNullObject(true);await c.sync();if(!u.isNullObject)u.clear("Contents");s.getRange(d.addr).formulas=d.f;await c.sync()}}catch(e){}}});
  if(!silent)add("Reverted: new sheets, charts and tables removed; cell contents restored. Formatting changes are not reverted.")}catch(e){if(!silent)add("Undo failed: "+e.message,"e")}}
async function go(){const t=$("in").value.trim();if(!t)return;$("in").value="";add(t,"u");$("send").disabled=true;const w=add("Working…");
 try{const info=await ctxInfo();hist.push({role:"user",content:`${t}\n\n[Workbook context]\n${info}`});
  const out=await llm(hist.slice(-8));hist.push({role:"assistant",content:out});w.remove();
  const mt=out.match(RX),say=out.replace(/```[\s\S]*?```/g,"").trim();const box=add(say||"Request processed.");if(!mt)return;
  let code=mt[1];const det=document.createElement("details");det.innerHTML="<summary>View code</summary>";const pre=document.createElement("pre");pre.textContent=code;det.appendChild(pre);box.appendChild(det);
  const exec=async()=>{snap=await snapshot();let tries=0;
   while(true){try{await run(code);add("Completed. Use Undo to revert.");return}
    catch(e){if(tries>=2){add("Unable to complete after 2 automatic corrections: "+e.message+"\nRephrase the request or split it into smaller steps.","e");await undo(true);return}
     tries++;add(`Error: ${e.message}\nCorrecting automatically (${tries}/2)…`,"e");await undo(true);
     hist.push({role:"user",content:`That code failed with: ${e.message}\nFix it and return the full corrected code block.`});
     const o=await llm(hist.slice(-8));hist.push({role:"assistant",content:o});const m=o.match(RX);if(!m){add("Automatic correction failed.","e");return}code=m[1];pre.textContent=code}}};
  if($("auto").checked)await exec();else{const b=document.createElement("button");b.className="btn";b.textContent="Run";b.onclick=async()=>{b.disabled=true;await exec()};box.appendChild(b)}
 }catch(e){w.remove();add("Error: "+e.message,"e")}finally{$("send").disabled=false}}
Office.onReady(init);
